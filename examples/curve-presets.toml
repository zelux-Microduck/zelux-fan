# 温控曲线示例（抄进 /etc/fanctl.toml 的 [fan.curve].points 即可）

# 1) 静音优先：不到 65℃ 基本不响，超过才拉高
# points = [[62, 40], [68, 70], [74, 100]]

# 2) 冷静优先（默认）：58℃ 起 70%，一路到 70℃ 全速
# points = [[58, 70], [64, 85], [70, 100]]

# 3) 恒定 50%（不想让它变来变去）
# points = [[0, 50]]

# 4) 激进：50℃ 就 60%，60℃ 全速（机箱闷/环境温度高时用）
# points = [[50, 60], [60, 100]]

# 5) 双段保底：55℃ 50%、70℃ 80%、80℃ 100%
# points = [[55, 50], [70, 80], [80, 100]]

# 说明：
# * 判据是「温度 >= 台阶温度就套那一档」，取满足条件的最后一档。
# * 都不满足时走 [fan] 里的 default_pct。
# * 温度取所有 /sys/class/thermal/thermal_zone*/temp 里最高的那个。
# * 写反温度（用递增的百分比配递减的温度）不会生效 —— 会被自动排序修正。
